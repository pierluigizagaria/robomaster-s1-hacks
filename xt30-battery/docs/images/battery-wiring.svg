<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" role="img" aria-labelledby="title description">
  <title id="title">RoboMaster S1 3S battery wiring</title>
  <desc id="description">Three cells in series connect to BMS B-, B1, B2 and B+. Separate three-port Wago positive and negative junctions connect the protected P+ and P- terminals to a 3S 12.6 V USB-C charger and the S1 XT30 connector. The switch opens only XT30 positive. A required source fuse is not documented and is not depicted as an installed part.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
    .heading { font-size: 25px; font-weight: 700; }
    .section { font-size: 19px; font-weight: 700; }
    .label { font-size: 18px; }
    .small { font-size: 15px; fill: #475569; }
    .terminal { font-size: 18px; font-weight: 700; }
    .cell { fill: #fce7ef; stroke: #a85975; stroke-width: 2; }
    .board { fill: #edf6f2; stroke: #4a7c68; stroke-width: 2; }
    .part { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    .tap { fill: none; stroke: #4a7c68; stroke-width: 3; }
    .positive { fill: none; stroke: #bb2d3b; stroke-width: 4; stroke-linejoin: round; }
    .negative { fill: none; stroke: #344256; stroke-width: 4; stroke-linejoin: round; }
    .usb { fill: none; stroke: #5466a9; stroke-width: 3; }
  </style>
  <rect width="1040" height="860" rx="16" fill="#ffffff"/>
  <text x="30" y="40" class="heading">RoboMaster S1 · 3S battery wiring</text>
  <text x="30" y="68" class="small">Functional map · charger, Wago junctions and switch placement confirmed by the owner</text>
  <text x="30" y="103" class="section">1. Cell stack and BMS taps</text>

  <rect x="110" y="140" width="180" height="64" rx="10" class="cell"/>
  <rect x="410" y="140" width="180" height="64" rx="10" class="cell"/>
  <rect x="710" y="140" width="180" height="64" rx="10" class="cell"/>
  <text x="125" y="179" class="terminal">−</text><text x="265" y="179" class="terminal">+</text>
  <text x="425" y="179" class="terminal">−</text><text x="565" y="179" class="terminal">+</text>
  <text x="725" y="179" class="terminal">−</text><text x="865" y="179" class="terminal">+</text>
  <text x="200" y="179" text-anchor="middle" class="label">Cell 1</text>
  <text x="500" y="179" text-anchor="middle" class="label">Cell 2</text>
  <text x="800" y="179" text-anchor="middle" class="label">Cell 3</text>
  <path d="M 60 172 H 110 M 290 172 H 410 M 590 172 H 710 M 890 172 H 980" class="tap"/>
  <circle cx="60" cy="172" r="5" fill="#4a7c68"/><circle cx="350" cy="172" r="5" fill="#4a7c68"/>
  <circle cx="650" cy="172" r="5" fill="#4a7c68"/><circle cx="980" cy="172" r="5" fill="#4a7c68"/>
  <text x="60" y="132" text-anchor="middle" class="small">0 V</text>
  <text x="350" y="132" text-anchor="middle" class="small">≤ 4.2 V</text>
  <text x="650" y="132" text-anchor="middle" class="small">≤ 8.4 V</text>
  <text x="980" y="132" text-anchor="middle" class="small">≤ 12.6 V</text>
  <rect x="30" y="244" width="980" height="92" rx="10" class="board"/>
  <path d="M 60 172 V 258 M 350 172 V 258 M 650 172 V 258 M 980 172 V 258" class="tap"/>
  <text x="60" y="285" text-anchor="middle" class="terminal">B−</text>
  <text x="350" y="285" text-anchor="middle" class="terminal">B1</text>
  <text x="650" y="285" text-anchor="middle" class="terminal">B2</text>
  <text x="980" y="285" text-anchor="middle" class="terminal">B+</text>
  <text x="520" y="318" text-anchor="middle" class="label">HW-380 balancing BMS · external terminals: P+ / P−</text>
  <text x="30" y="365" class="small">Voltages relative to B−; fully charged ceilings. Wire colors in the photographs are not a pinout.</text>

  <text x="30" y="412" class="section">2. Protected power and charging branches</text>
  <rect x="35" y="450" width="115" height="40" rx="8" class="board"/>
  <rect x="35" y="720" width="115" height="40" rx="8" class="board"/>
  <text x="92" y="477" text-anchor="middle" class="terminal">BMS P+</text>
  <text x="92" y="747" text-anchor="middle" class="terminal">BMS P−</text>

  <rect x="850" y="440" width="160" height="330" rx="10" class="part"/>
  <text x="930" y="474" text-anchor="middle" class="terminal">XT30 +</text>
  <text x="930" y="746" text-anchor="middle" class="terminal">XT30 −</text>
  <text x="930" y="578" text-anchor="middle" class="label">RoboMaster S1</text>
  <text x="930" y="605" text-anchor="middle" class="small">Power only</text>
  <text x="930" y="631" text-anchor="middle" class="small">No data bus</text>

  <path d="M 150 470 H 530 M 700 470 H 850 M 320 470 V 560 H 520" class="positive"/>
  <path d="M 150 740 H 850 M 320 740 V 610 H 520" class="negative"/>
  <rect x="240" y="449" width="160" height="42" rx="8" fill="#fff3f3" stroke="#bb2d3b" stroke-width="2"/>
  <rect x="240" y="719" width="160" height="42" rx="8" fill="#edf0f5" stroke="#344256" stroke-width="2"/>
  <text x="320" y="477" text-anchor="middle" class="label">Wago (+)</text>
  <text x="320" y="747" text-anchor="middle" class="label">Wago (−)</text>
  <circle cx="320" cy="491" r="5" fill="#bb2d3b"/><circle cx="320" cy="719" r="5" fill="#344256"/>
  <text x="240" y="520" class="small">3 ports / one node each</text>

  <rect x="530" y="443" width="170" height="54" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <path d="M 545 470 H 570 M 570 470 L 640 450 M 650 470 H 685" class="positive"/>
  <circle cx="570" cy="470" r="4" fill="#bb2d3b"/><circle cx="650" cy="470" r="4" fill="#bb2d3b"/>
  <text x="615" y="431" text-anchor="middle" class="label">Rocker switch</text>
  <text x="615" y="521" text-anchor="middle" class="small">Opens XT30 positive only</text>

  <rect x="520" y="542" width="230" height="90" rx="10" class="part"/>
  <text x="532" y="566" class="terminal">+</text><text x="532" y="616" class="terminal">−</text>
  <text x="644" y="577" text-anchor="middle" class="label">USB-C charger</text>
  <text x="644" y="603" text-anchor="middle" class="label">3S / 12.6 V</text>
  <text x="375" y="551" class="small">Pack output +</text>
  <text x="375" y="640" class="small">Pack output −</text>
  <path d="M 635 632 V 660" class="usb"/>
  <rect x="520" y="660" width="230" height="42" rx="8" fill="#eef0ff" stroke="#5466a9" stroke-width="2"/>
  <text x="635" y="687" text-anchor="middle" class="label">USB supply → USB-C</text>

  <text x="30" y="804" class="small">The charger stays connected with the switch off. Switch-off does not isolate the pack.</text>
  <text x="30" y="832" class="small">Source fuse required; installation/value/location not documented, so it is not depicted as an installed part.</text>
</svg>
